<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Muted duotone illustration of transmission towers, a power plant with wind turbine, and a lit data center building converging on one horizon under a banded dusk sky." preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="gc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F6E6A"/>
      <stop offset="0.45" stop-color="#93916A"/>
      <stop offset="0.75" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#B0623A"/>
    </linearGradient>
    <pattern id="gc-grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.9" fill="#17130F" opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#gc-sky)"/>

  <g stroke="#E4DCC8" stroke-width="4" opacity="0.14" fill="none">
    <path d="M-20,220 H700"/>
    <path d="M820,260 H1600"/>
    <path d="M200,340 H1020"/>
    <path d="M1150,380 H1650"/>
  </g>

  <polygon points="0,660 260,648 560,662 880,644 1180,658 1600,646 1600,900 0,900" fill="#241F1B"/>

  <!-- generation plant, left -->
  <g opacity="0.95">
    <polygon points="70,760 320,760 320,900 70,900" fill="#241F1B"/>
    <rect x="150" y="600" width="30" height="160" fill="#241F1B"/>
    <rect x="142" y="756" width="46" height="14" fill="#241F1B"/>
    <path d="M760,208 q10,-6 18,2 q10,-8 18,0" stroke="#E4DCC8" stroke-width="1.5" fill="none" opacity="0" />
    <ellipse cx="165" cy="590" rx="26" ry="16" fill="#E4DCC8" opacity="0.45"/>
    <ellipse cx="205" cy="562" rx="34" ry="20" fill="#E4DCC8" opacity="0.32"/>
    <ellipse cx="258" cy="536" rx="42" ry="24" fill="#E4DCC8" opacity="0.2"/>
    <rect x="196" y="700" width="150" height="60" fill="#B0623A"/>
    <rect x="196" y="700" width="150" height="8" fill="#241F1B"/>
    <rect x="214" y="716" width="10" height="14" fill="#C9A227" opacity="0.85"/>
    <rect x="234" y="716" width="10" height="14" fill="#C9A227" opacity="0.55"/>
    <rect x="254" y="716" width="10" height="14" fill="#C9A227" opacity="0.85"/>
    <rect x="274" y="716" width="10" height="14" fill="#C9A227" opacity="0.55"/>
    <rect x="294" y="716" width="10" height="14" fill="#C9A227" opacity="0.85"/>

    <!-- wind turbine -->
    <g transform="translate(80,0)">
      <polygon points="-6,760 6,760 3,600 -3,600" fill="#241F1B"/>
      <g transform="translate(0,600)">
        <path d="M -3,-4 C -2,-34 -1,-72 0,-96 C 1,-72 2,-34 3,-4 Z" fill="#241F1B"/>
        <path d="M -3,-4 C -2,-34 -1,-72 0,-96 C 1,-72 2,-34 3,-4 Z" fill="#241F1B" transform="rotate(120)"/>
        <path d="M -3,-4 C -2,-34 -1,-72 0,-96 C 1,-72 2,-34 3,-4 Z" fill="#241F1B" transform="rotate(240)"/>
        <circle cx="0" cy="0" r="6" fill="#241F1B"/>
      </g>
    </g>
  </g>

  <!-- transmission towers, center -->
  <g>
    <path d="M760,470 C830,610 830,700 830,730" stroke="#241F1B" stroke-width="3.5" fill="none"/>
    <path d="M760,470 L690,730 M760,470 L830,730" stroke="#241F1B" stroke-width="6.5" fill="none"/>
    <line x1="690" y1="730" x2="830" y2="730" stroke="#241F1B" stroke-width="6.5"/>
    <g stroke="#241F1B" stroke-width="4.5" fill="none">
      <line x1="716" y1="650" x2="804" y2="650"/>
      <line x1="694" y1="712" x2="804" y2="650"/>
      <line x1="826" y1="712" x2="716" y2="650"/>
      <line x1="728" y1="580" x2="792" y2="580"/>
      <line x1="708" y1="662" x2="792" y2="580"/>
      <line x1="812" y1="662" x2="728" y2="580"/>
    </g>
    <line x1="676" y1="500" x2="844" y2="500" stroke="#241F1B" stroke-width="6.5"/>
    <line x1="760" y1="470" x2="760" y2="500" stroke="#241F1B" stroke-width="6.5"/>
    <circle cx="692" cy="500" r="4.5" fill="#C9A227"/>
    <circle cx="828" cy="500" r="4.5" fill="#C9A227"/>

    <g transform="translate(1040,0)" opacity="0.88">
      <path d="M0,530 C50,630 50,700 50,724" stroke="#241F1B" stroke-width="2.5" fill="none"/>
      <path d="M0,530 L-48,724 M0,530 L48,724" stroke="#241F1B" stroke-width="4.5" fill="none"/>
      <line x1="-48" y1="724" x2="48" y2="724" stroke="#241F1B" stroke-width="4.5"/>
      <line x1="-28" y1="600" x2="28" y2="600" stroke="#241F1B" stroke-width="3.5"/>
      <line x1="-38" y1="660" x2="38" y2="660" stroke="#241F1B" stroke-width="3.5"/>
      <line x1="-58" y1="560" x2="58" y2="560" stroke="#241F1B" stroke-width="4.5"/>
      <line x1="0" y1="530" x2="0" y2="560" stroke="#241F1B" stroke-width="4.5"/>
      <circle cx="-40" cy="560" r="3.5" fill="#C9A227"/>
      <circle cx="40" cy="560" r="3.5" fill="#C9A227"/>
    </g>

    <g transform="translate(1280,0)" opacity="0.7">
      <path d="M0,580 L-32,724 M0,580 L32,724" stroke="#241F1B" stroke-width="3" fill="none"/>
      <line x1="-32" y1="724" x2="32" y2="724" stroke="#241F1B" stroke-width="3"/>
      <line x1="-40" y1="620" x2="40" y2="620" stroke="#241F1B" stroke-width="3"/>
      <line x1="0" y1="580" x2="0" y2="620" stroke="#241F1B" stroke-width="3"/>
    </g>

    <path d="M760,500 C620,486 500,494 380,478" stroke="#241F1B" stroke-width="1.6" fill="none" opacity="0.65"/>
    <path d="M844,500 C920,510 980,525 1040,560" stroke="#241F1B" stroke-width="1.6" fill="none" opacity="0.65"/>
    <path d="M1040,560 C1140,558 1200,566 1280,580" stroke="#241F1B" stroke-width="1.2" fill="none" opacity="0.55"/>
    <path d="M1280,620 C1340,628 1400,636 1460,646" stroke="#241F1B" stroke-width="1" fill="none" opacity="0.5"/>
  </g>

  <!-- data center block, right -->
  <g opacity="0.95">
    <rect x="1360" y="680" width="200" height="100" fill="#241F1B"/>
    <rect x="1360" y="668" width="200" height="14" fill="#241F1B"/>
    <rect x="1384" y="702" width="15" height="15" fill="#C9A227" opacity="0.85"/>
    <rect x="1414" y="702" width="15" height="15" fill="#C9A227" opacity="0.5"/>
    <rect x="1444" y="702" width="15" height="15" fill="#C9A227" opacity="0.85"/>
    <rect x="1474" y="702" width="15" height="15" fill="#C9A227" opacity="0.5"/>
    <rect x="1384" y="730" width="15" height="15" fill="#C9A227" opacity="0.5"/>
    <rect x="1414" y="730" width="15" height="15" fill="#C9A227" opacity="0.85"/>
    <rect x="1444" y="730" width="15" height="15" fill="#C9A227" opacity="0.5"/>
    <rect x="1474" y="730" width="15" height="15" fill="#C9A227" opacity="0.85"/>
    <rect x="1504" y="702" width="15" height="15" fill="#C9A227" opacity="0.7"/>
    <rect x="1504" y="730" width="15" height="15" fill="#C9A227" opacity="0.4"/>
  </g>

  <!-- bird, small charm detail -->
  <path d="M100,430 q10,-10 20,-2 q7,-8 16,-1" stroke="#241F1B" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>

  <rect width="1600" height="900" fill="url(#gc-grain)"/>
</svg>
