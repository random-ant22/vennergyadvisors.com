<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Muted duotone illustration of a wind turbine beside a natural gas power plant with a smoking stack, connected by a small transmission tower, on rolling hills at dusk.">
  <defs>
    <linearGradient id="pg-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F6E6A"/>
      <stop offset="0.55" stop-color="#8C9A82"/>
      <stop offset="1" stop-color="#E4DCC8"/>
    </linearGradient>
    <radialGradient id="pg-sun" cx="0.78" cy="0.32" r="0.26">
      <stop offset="0" stop-color="#C9A227" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pg-grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.9" fill="#241F1B" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="960" height="600" fill="url(#pg-sky)"/>
  <circle cx="748" cy="192" r="150" fill="url(#pg-sun)"/>

  <polygon points="0,340 160,300 340,335 520,295 700,330 880,300 960,325 960,420 0,420" fill="#3E5C58" opacity="0.85"/>
  <polygon points="0,420 960,420 960,460 0,460" fill="#241F1B"/>

  <!-- wind turbine -->
  <g>
    <polygon points="223,460 237,460 232,150 228,150" fill="#241F1B"/>
    <g transform="translate(230,150)">
      <path d="M -4,-6 C -3,-42 -1,-92 0,-120 C 1,-92 3,-42 4,-6 Z" fill="#241F1B"/>
      <path d="M -4,-6 C -3,-42 -1,-92 0,-120 C 1,-92 3,-42 4,-6 Z" fill="#241F1B" transform="rotate(120)"/>
      <path d="M -4,-6 C -3,-42 -1,-92 0,-120 C 1,-92 3,-42 4,-6 Z" fill="#241F1B" transform="rotate(240)"/>
      <circle cx="0" cy="0" r="8" fill="#241F1B"/>
    </g>
  </g>

  <!-- second, smaller wind turbine for depth -->
  <g transform="translate(120,300) scale(0.55)">
    <polygon points="-7,320 7,320 4,0 -4,0" fill="#241F1B" opacity="0.65"/>
    <g>
      <path d="M -4,-6 C -3,-42 -1,-92 0,-120 C 1,-92 3,-42 4,-6 Z" fill="#241F1B" opacity="0.65"/>
      <path d="M -4,-6 C -3,-42 -1,-92 0,-120 C 1,-92 3,-42 4,-6 Z" fill="#241F1B" opacity="0.65" transform="rotate(120)"/>
      <path d="M -4,-6 C -3,-42 -1,-92 0,-120 C 1,-92 3,-42 4,-6 Z" fill="#241F1B" opacity="0.65" transform="rotate(240)"/>
      <circle cx="0" cy="0" r="7" fill="#241F1B" opacity="0.65"/>
    </g>
  </g>

  <!-- natural gas plant -->
  <path d="M760,208 q10,-6 18,2 q10,-8 18,0" stroke="#241F1B" stroke-width="1.5" fill="none" opacity="0.4"/>
  <ellipse cx="760" cy="196" rx="14" ry="10" fill="#E4DCC8" opacity="0.5"/>
  <ellipse cx="782" cy="176" rx="20" ry="13" fill="#E4DCC8" opacity="0.4"/>
  <ellipse cx="812" cy="155" rx="27" ry="16" fill="#E4DCC8" opacity="0.32"/>
  <ellipse cx="852" cy="138" rx="33" ry="18" fill="#E4DCC8" opacity="0.24"/>
  <ellipse cx="898" cy="126" rx="38" ry="20" fill="#E4DCC8" opacity="0.15"/>

  <rect x="744" y="212" width="18" height="168" fill="#241F1B"/>
  <rect x="739" y="372" width="28" height="12" fill="#241F1B"/>

  <rect x="586" y="404" width="26" height="56" rx="13" fill="#2E4844"/>
  <rect x="616" y="414" width="24" height="46" rx="12" fill="#2E4844"/>

  <rect x="628" y="378" width="150" height="82" fill="#B0623A"/>
  <rect x="628" y="378" width="150" height="8" fill="#241F1B"/>
  <rect x="644" y="398" width="9" height="13" fill="#C9A227" opacity="0.9"/>
  <rect x="662" y="398" width="9" height="13" fill="#C9A227" opacity="0.6"/>
  <rect x="680" y="398" width="9" height="13" fill="#C9A227" opacity="0.9"/>
  <rect x="698" y="398" width="9" height="13" fill="#C9A227" opacity="0.6"/>
  <rect x="644" y="422" width="9" height="13" fill="#C9A227" opacity="0.6"/>
  <rect x="662" y="422" width="9" height="13" fill="#C9A227" opacity="0.9"/>
  <rect x="680" y="422" width="9" height="13" fill="#C9A227" opacity="0.6"/>
  <rect x="698" y="422" width="9" height="13" fill="#C9A227" opacity="0.9"/>

  <rect x="786" y="410" width="64" height="50" fill="#241F1B"/>
  <rect x="798" y="422" width="8" height="12" fill="#C9A227" opacity="0.8"/>
  <rect x="814" y="422" width="8" height="12" fill="#C9A227" opacity="0.5"/>
  <rect x="830" y="422" width="8" height="12" fill="#C9A227" opacity="0.8"/>

  <!-- transmission tower linking the plant to the grid -->
  <path d="M888,270 C905,330 905,410 905,458" stroke="#241F1B" stroke-width="2" fill="none"/>
  <path d="M888,270 L868,458 M888,270 L908,458" stroke="#241F1B" stroke-width="3.5" fill="none"/>
  <line x1="868" y1="458" x2="908" y2="458" stroke="#241F1B" stroke-width="3.5"/>
  <line x1="874" y1="310" x2="902" y2="310" stroke="#241F1B" stroke-width="3"/>
  <line x1="888" y1="270" x2="888" y2="310" stroke="#241F1B" stroke-width="3"/>
  <circle cx="878" cy="310" r="2.6" fill="#C9A227"/>
  <circle cx="898" cy="310" r="2.6" fill="#C9A227"/>

  <path d="M888,310 C820,296 720,300 630,296" stroke="#241F1B" stroke-width="1.4" fill="none" opacity="0.7"/>
  <path d="M888,310 C930,306 948,304 962,302" stroke="#241F1B" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M230,150 C400,180 520,240 628,296" stroke="#241F1B" stroke-width="1" fill="none" opacity="0.4"/>

  <path d="M60,140 q10,-8 20,0 q10,-8 20,0" stroke="#241F1B" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M400,110 q9,-7 18,0 q9,-7 18,0" stroke="#241F1B" stroke-width="2" fill="none" opacity="0.5"/>

  <path d="M0,455 q8,-8 16,0 M40,458 q8,-8 16,0 M960,452 q-8,-8 -16,0" stroke="#241F1B" stroke-width="2" fill="none" opacity="0.5"/>

  <rect width="960" height="600" fill="url(#pg-grain)"/>
</svg>
