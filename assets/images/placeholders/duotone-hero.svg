<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20262b"/>
      <stop offset="55%" stop-color="#1d525e"/>
      <stop offset="100%" stop-color="#34C2D7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#FFC20E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFC20E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16323a"/>
      <stop offset="100%" stop-color="#0e2429"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- distant hills -->
  <path d="M0,640 L180,600 380,650 600,610 820,660 1040,605 1280,655 1600,615 1600,900 0,900 Z" fill="#12303a" opacity="0.85"/>
  <!-- foreground ground -->
  <path d="M0,700 L260,672 520,705 760,678 1020,710 1280,676 1600,702 1600,900 0,900 Z" fill="url(#ground)"/>

  <!-- generation plant, left -->
  <g opacity="0.92">
    <rect x="90" y="588" width="150" height="112" fill="#0e2429"/>
    <rect x="150" y="520" width="16" height="70" fill="#0e2429"/>
    <rect x="190" y="500" width="16" height="90" fill="#0e2429"/>
    <ellipse cx="158" cy="512" rx="20" ry="10" fill="#0e2429" opacity="0.7"/>
    <ellipse cx="198" cy="492" rx="20" ry="10" fill="#0e2429" opacity="0.7"/>
  </g>

  <!-- data center block, right -->
  <g opacity="0.92">
    <rect x="1360" y="606" width="190" height="94" fill="#0e2429"/>
    <rect x="1382" y="628" width="14" height="14" fill="#FFC20E" opacity="0.85"/>
    <rect x="1410" y="628" width="14" height="14" fill="#FFC20E" opacity="0.55"/>
    <rect x="1438" y="628" width="14" height="14" fill="#FFC20E" opacity="0.85"/>
    <rect x="1382" y="654" width="14" height="14" fill="#FFC20E" opacity="0.55"/>
    <rect x="1410" y="654" width="14" height="14" fill="#FFC20E" opacity="0.85"/>
    <rect x="1438" y="654" width="14" height="14" fill="#FFC20E" opacity="0.55"/>
    <rect x="1466" y="628" width="14" height="14" fill="#FFC20E" opacity="0.7"/>
    <rect x="1466" y="654" width="14" height="14" fill="#FFC20E" opacity="0.4"/>
  </g>

  <!-- transmission towers -->
  <g stroke="#0e2429" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- tower 1 (large, center-left) -->
    <g transform="translate(560,0)">
      <line x1="0" y1="640" x2="-46" y2="760" />
      <line x1="0" y1="640" x2="46" y2="760" />
      <line x1="-30" y1="700" x2="30" y2="700" />
      <line x1="-38" y1="730" x2="38" y2="730" />
      <line x1="-46" y1="760" x2="46" y2="760" />
      <line x1="-30" y1="700" x2="30" y2="760" />
      <line x1="30" y1="700" x2="-30" y2="760" />
      <line x1="-58" y1="600" x2="58" y2="600" />
      <line x1="-40" y1="600" x2="0" y2="640" />
      <line x1="40" y1="600" x2="0" y2="640" />
      <line x1="-58" y1="600" x2="-58" y2="584" />
      <line x1="58" y1="600" x2="58" y2="584" />
      <line x1="0" y1="600" x2="0" y2="560" />
    </g>
    <!-- wires -->
    <path d="M502,600 C300,585 120,610 -40,592" />
    <path d="M618,600 C820,588 1000,606 1180,594" />

    <!-- tower 2 (mid distance) -->
    <g transform="translate(870,0)" opacity="0.88">
      <line x1="0" y1="672" x2="-30" y2="752" />
      <line x1="0" y1="672" x2="30" y2="752" />
      <line x1="-20" y1="712" x2="20" y2="712" />
      <line x1="-25" y1="732" x2="25" y2="732" />
      <line x1="-38" y1="640" x2="38" y2="640" />
      <line x1="-26" y1="640" x2="0" y2="672" />
      <line x1="26" y1="640" x2="0" y2="672" />
      <line x1="0" y1="640" x2="0" y2="612" />
    </g>
    <path d="M844,640 C760,630 700,644 630,634" />
    <path d="M896,640 C960,630 1010,642 1070,632" />

    <!-- tower 3 (far distance, small) -->
    <g transform="translate(1150,0)" opacity="0.72">
      <line x1="0" y1="690" x2="-20" y2="742" />
      <line x1="0" y1="690" x2="20" y2="742" />
      <line x1="-14" y1="716" x2="14" y2="716" />
      <line x1="-26" y1="666" x2="26" y2="666" />
      <line x1="-18" y1="666" x2="0" y2="690" />
      <line x1="18" y1="666" x2="0" y2="690" />
    </g>
  </g>
</svg>
